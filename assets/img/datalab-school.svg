<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="부산 학교·학군 데이터랩 대표 이미지">
  <rect width="480" height="270" fill="#E5F5F3"/>
  <!-- 격자 지도 배경 -->
  <g stroke="#C2DDD9" stroke-width="1" fill="none">
    <line x1="80"  y1="0" x2="80"  y2="270"/>
    <line x1="160" y1="0" x2="160" y2="270"/>
    <line x1="240" y1="0" x2="240" y2="270"/>
    <line x1="320" y1="0" x2="320" y2="270"/>
    <line x1="400" y1="0" x2="400" y2="270"/>
    <line x1="0" y1="54"  x2="480" y2="54"/>
    <line x1="0" y1="108" x2="480" y2="108"/>
    <line x1="0" y1="162" x2="480" y2="162"/>
    <line x1="0" y1="216" x2="480" y2="216"/>
  </g>
  <!-- 학교 위치 핀 (크기 다양하게) -->
  <circle cx="110" cy="75"  r="10" fill="#176B63" opacity=".85"/>
  <circle cx="200" cy="130" r="14" fill="#176B63" opacity=".9"/>
  <circle cx="320" cy="88"  r="9"  fill="#176B63" opacity=".75"/>
  <circle cx="380" cy="180" r="12" fill="#176B63" opacity=".85"/>
  <circle cx="140" cy="195" r="8"  fill="#9DD4CC"/>
  <circle cx="260" cy="220" r="11" fill="#9DD4CC"/>
  <circle cx="440" cy="110" r="9"  fill="#9DD4CC"/>
  <circle cx="60"  cy="150" r="7"  fill="#9DD4CC"/>
  <circle cx="350" cy="240" r="8"  fill="#B8E0DA"/>
  <circle cx="180" cy="50"  r="7"  fill="#B8E0DA"/>
  <circle cx="420" cy="55"  r="6"  fill="#B8E0DA"/>
  <!-- 하단 라벨 -->
  <rect y="240" width="480" height="30" fill="rgba(255,255,255,.7)"/>
  <text x="240" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f4f49" font-weight="700">부산 학교 분포 · 지역별 교육 데이터 탐색</text>
</svg>
