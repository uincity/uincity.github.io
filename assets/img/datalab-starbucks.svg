<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="스타벅스 상권분석 데이터랩 대표 이미지">
  <!-- 배경 -->
  <rect width="480" height="270" fill="#E5F5F3"/>
  
  <!-- 도로 및 상권 블록 라인 -->
  <g stroke="#C2DDD9" stroke-width="1.5" fill="none">
    <path d="M 40,40 L 440,40"/>
    <path d="M 40,110 L 440,110"/>
    <path d="M 40,180 L 440,180"/>
    <path d="M 120,20 L 120,230"/>
    <path d="M 240,20 L 240,230"/>
    <path d="M 360,20 L 360,230"/>
    <!-- 대각선 도로망 -->
    <path d="M 50,210 L 220,50" stroke="#B8E0DA" stroke-width="3"/>
    <path d="M 220,50 L 430,190" stroke="#B8E0DA" stroke-width="3"/>
  </g>

  <!-- 상권 분석 반경 (버퍼/히트 영역) -->
  <circle cx="240" cy="110" r="54" fill="#9DD4CC" opacity="0.35"/>
  <circle cx="240" cy="110" r="32" fill="#176B63" opacity="0.2"/>
  <circle cx="120" cy="150" r="38" fill="#9DD4CC" opacity="0.25"/>
  <circle cx="360" cy="80"  r="42" fill="#9DD4CC" opacity="0.25"/>

  <!-- 커피잔 / 테이크아웃 컵 그래픽 마커 (중앙) -->
  <g transform="translate(240, 110)">
    <!-- 핀 마커 -->
    <path d="M 0,0 C -18,-18 -20,-38 0,-52 C 20,-38 18,-18 0,0 Z" fill="#176B63"/>
    <circle cx="0" cy="-34" r="14" fill="#FFFFFF"/>
    <!-- 커피 컵 아이콘 -->
    <path d="M -7,-40 L 7,-40 L 5,-27 C 5,-25 3,-24 0,-24 C -3,-24 -5,-25 -5,-27 Z" fill="#176B63"/>
    <ellipse cx="0" cy="-40" rx="7" ry="2" fill="#9DD4CC"/>
    <path d="M 5,-36 C 8,-36 9,-34 9,-32 C 9,-30 8,-29 5,-29" stroke="#176B63" stroke-width="1.5" fill="none"/>
  </g>

  <!-- 보조 매장 위치 핀들 -->
  <!-- 핀 1 (좌측) -->
  <g transform="translate(120, 150)">
    <path d="M 0,0 C -12,-12 -14,-26 0,-36 C 14,-26 12,-12 0,0 Z" fill="#176B63" opacity="0.9"/>
    <circle cx="0" cy="-23" r="6" fill="#FFFFFF"/>
    <circle cx="0" cy="-23" r="3" fill="#176B63"/>
  </g>

  <!-- 핀 2 (우상단) -->
  <g transform="translate(360, 80)">
    <path d="M 0,0 C -12,-12 -14,-26 0,-36 C 14,-26 12,-12 0,0 Z" fill="#176B63" opacity="0.9"/>
    <circle cx="0" cy="-23" r="6" fill="#FFFFFF"/>
    <circle cx="0" cy="-23" r="3" fill="#176B63"/>
  </g>

  <!-- 서브 핀 (주변 매장들) -->
  <circle cx="180" cy="70"  r="5" fill="#176B63" opacity="0.75"/>
  <circle cx="300" cy="165" r="6" fill="#176B63" opacity="0.8"/>
  <circle cx="410" cy="140" r="5" fill="#9DD4CC"/>
  <circle cx="70"  cy="90"  r="4" fill="#9DD4CC"/>

  <!-- 상권 분석 지표 배지 -->
  <g transform="translate(340, 195)">
    <rect x="0" y="0" width="105" height="24" rx="12" fill="#FFFFFF" opacity="0.92" stroke="#176B63" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#176B63"/>
    <text x="24" y="16" font-family="sans-serif" font-size="10" fill="#176B63" font-weight="700">상권 입지 분석</text>
  </g>

  <!-- 하단 라벨 바 -->
  <rect y="240" width="480" height="30" fill="rgba(255,255,255,.75)"/>
  <text x="240" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f4f49" font-weight="700">스타벅스 매장 분포 · 상권 입지 데이터 탐색</text>
</svg>
