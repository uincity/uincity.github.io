  <!-- 하단 라벨 -->
  <rect y="242" width="480" height="28" fill="rgba(255,255,255,.7)"/>
  <text x="240" y="261" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f4f49" font-weight="700">역별 승하차 · 시간대별 이용 패턴 탐색</text>
