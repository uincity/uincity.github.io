  <circle cx="100" cy="72"  r="6" fill="#fff" stroke="#176B63" stroke-width="3"/>
  <circle cx="180" cy="97"  r="8" fill="#176B63"/>
  <circle cx="260" cy="128" r="6" fill="#fff" stroke="#176B63" stroke-width="3"/>
  <circle cx="340" cy="118" r="6" fill="#fff" stroke="#176B63" stroke-width="3"/>
  <circle cx="420" cy="114" r="6" fill="#fff" stroke="#176B63" stroke-width="3"/>
  <circle cx="460" cy="130" r="6" fill="#fff" stroke="#176B63" stroke-width="3"/>
  <!-- 역 점 (2호선) -->
  <circle cx="30"  cy="160" r="6" fill="#fff" stroke="#9DD4CC" stroke-width="3"/>
  <circle cx="110" cy="148" r="6" fill="#fff" stroke="#9DD4CC" stroke-width="3"/>
  <circle cx="200" cy="168" r="8" fill="#9DD4CC"/>
  <circle cx="280" cy="178" r="6" fill="#fff" stroke="#9DD4CC" stroke-width="3"/>
  <circle cx="360" cy="152" r="6" fill="#fff" stroke="#9DD4CC" stroke-width="3"/>
  <circle cx="440" cy="150" r="6" fill="#fff" stroke="#9DD4CC" stroke-width="3"/>
  <!-- 환승역 -->
  <circle cx="180" cy="97"  r="4" fill="#fff"/>
  <circle cx="200" cy="168" r="4" fill="#fff"/>
  <!-- 범례 -->
  <rect x="18" y="220" width="16" height="4" rx="2" fill="#176B63"/>
  <text x="40" y="228" font-family="sans-serif" font-size="11" fill="#0f4f49">1호선</text>
  <rect x="90" y="220" width="16" height="4" rx="2" fill="#9DD4CC"/>
